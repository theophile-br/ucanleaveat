<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Time Companion for ATOSS - Settings Screenshot</title>
    <link href="../bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    <style>
        html,
        body.stage {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background: #1e1e2f;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
            box-shadow: none;
        }

        .popup-frame {
            width: 450px;
            min-height: 220px;
            padding: 10px;
            color: aliceblue;
            letter-spacing: 0.35px;
            box-sizing: border-box;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
            text-align: center;
            position: relative;
        }

        .popup-frame .settings-toggle {
            position: absolute;
        }
    </style>
</head>

<body class="stage settings-open">
    <div class="popup-frame gradient-anim">
        <button class="settings-toggle" aria-label="Close settings">
            <svg class="icon-gear" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16"
                fill="currentColor">
                <path
                    d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492M5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0" />
                <path
                    d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115z" />
            </svg>
            <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16"
                fill="currentColor">
                <path
                    d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708" />
            </svg>
        </button>

        <div class="view">
            <p class="settings-title">Settings</p>
            <div class="glass setting-card">
                <div class="label-block">
                    <label class="setting-name">Employment</label>
                    <span class="setting-preview">06:34 per day</span>
                </div>
                <input type="number" class="transparent input-work-rate" value="80" min="50" max="100" step="10" />
            </div>
            <div class="glass setting-card">
                <div class="label-block">
                    <label class="setting-name">Daily hours</label>
                </div>
                <input type="time" class="transparent input-inline" value="08:12" />
            </div>
            <div class="glass setting-card">
                <div class="label-block">
                    <label class="setting-name">Mandatory break</label>
                </div>
                <input type="time" class="transparent input-inline" value="00:30" />
            </div>
        </div>
    </div>
</body>

</html>
