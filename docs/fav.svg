<svg xmlns="http://www.w3.org/2000/svg" viewBox="78 56 400 400" role="img" aria-label="U Can Leave At">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="clockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="arrowShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="2" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.40"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Clock face -->
  <g filter="url(#clockShadow)">
    <circle cx="232" cy="256" r="154" fill="url(#face)"/>
    <circle cx="232" cy="256" r="154" fill="none" stroke="#0F172A" stroke-opacity="0.10" stroke-width="4"/>
  </g>

  <g fill="#0F172A" stroke="none">
    <rect x="226" y="114" width="12" height="28" rx="3"/>
    <rect x="346" y="250" width="28" height="12" rx="3"/>
    <rect x="226" y="370" width="12" height="28" rx="3"/>
    <rect x="90"  y="250" width="28" height="12" rx="3"/>
  </g>
  <g fill="#0F172A" stroke="none">
    <rect x="294" y="130" width="8" height="20" rx="2" transform="rotate(30 298 140)"/>
    <rect x="342" y="180" width="8" height="20" rx="2" transform="rotate(60 346 190)"/>
    <rect x="342" y="312" width="8" height="20" rx="2" transform="rotate(120 346 322)"/>
    <rect x="294" y="362" width="8" height="20" rx="2" transform="rotate(150 298 372)"/>
    <rect x="162" y="362" width="8" height="20" rx="2" transform="rotate(210 166 372)"/>
    <rect x="114" y="312" width="8" height="20" rx="2" transform="rotate(240 118 322)"/>
    <rect x="114" y="180" width="8" height="20" rx="2" transform="rotate(300 118 190)"/>
    <rect x="162" y="130" width="8" height="20" rx="2" transform="rotate(330 166 140)"/>
  </g>

  <line x1="232" y1="256" x2="232" y2="150"
        stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>
  <line x1="232" y1="256" x2="304" y2="216"
        stroke="#0F172A" stroke-width="18" stroke-linecap="round"/>
  <circle cx="232" cy="256" r="14" fill="#0F172A"/>
  <circle cx="232" cy="256" r="6"  fill="#F8FAFC"/>

  <g filter="url(#arrowShadow)">
    <polygon points="
      100,290
      380,290
      380,254
      478,318
      380,382
      380,346
      100,346"
      fill="url(#arrow)"/>
    <polygon points="
      104,294
      376,294
      376,308
      104,308"
      fill="#ffffff" opacity="0.22"/>
  </g>
</svg>
